name: Generate Context Dump

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          pwd
          ls
          find .

      - name: Generate context.txt
        run: |
          mkdir -p output

          find BoxingDay/Assets/Scripts -name "*.cs" | sort | while read f; do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done > output/context.txt

          echo "Generated file:"
          ls output
          wc -l output/context.txt

      - name: Commit context.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/context.txt

          if ! git diff --staged --quiet; then
            git commit -m "chore: update context dump"
            git push
          else
            echo "No changes to commit"
          fi
