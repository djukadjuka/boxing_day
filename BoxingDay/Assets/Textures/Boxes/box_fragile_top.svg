<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ===== Boxing Day :: Fragile box TOP (hazard border, do-not-stack) ===== -->
  <defs>
    <pattern id="speck_frg" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6"  cy="9"  r="1.4" fill="#000000" fill-opacity="0.086"/>
      <circle cx="24" cy="16" r="1.1" fill="#000000" fill-opacity="0.071"/>
      <circle cx="14" cy="31" r="1.6" fill="#000000" fill-opacity="0.059"/>
      <circle cx="33" cy="35" r="1.1" fill="#000000" fill-opacity="0.078"/>
    </pattern>
    <pattern id="hazard" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#c0392b"/>
      <path d="M0 24 L20 0 L40 0 L20 24 Z" fill="#f4f0e2"/>
    </pattern>
    <pattern id="hazard_v" width="24" height="40" patternUnits="userSpaceOnUse">
      <rect width="24" height="40" fill="#c0392b"/>
      <path d="M24 0 L24 20 L0 40 L0 20 Z" fill="#f4f0e2"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#cda874"/>
  <rect width="512" height="512" fill="url(#speck_frg)"/>
  <rect x="0" y="0" width="256" height="512" fill="#000000" fill-opacity="0.031"/>

  <!-- flap creases + center seam -->
  <rect x="44" y="44" width="424" height="424" fill="none" stroke="#000000" stroke-opacity="0.086" stroke-width="3"/>
  <rect x="252" y="44" width="8" height="424" fill="#000000" fill-opacity="0.133"/>

  <!-- packing tape down the seam -->
  <rect x="228" y="44" width="56" height="424" fill="#e7dbb6" opacity="0.85"/>
  <rect x="228" y="44" width="4" height="424" fill="#000000" fill-opacity="0.133"/>
  <rect x="280" y="44" width="4" height="424" fill="#000000" fill-opacity="0.133"/>

  <!-- full hazard border -->
  <rect x="0" y="0"   width="512" height="24" fill="url(#hazard)"/>
  <rect x="0" y="488" width="512" height="24" fill="url(#hazard)"/>
  <rect x="0" y="0"   width="24" height="512" fill="url(#hazard_v)"/>
  <rect x="488" y="0" width="24" height="512" fill="url(#hazard_v)"/>

  <!-- broken-glass icon -->
  <g transform="translate(0 28)" stroke="#c0392b" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M214 96 Q214 150 256 162 Q298 150 298 96 Z"/>
    <path d="M256 162 L256 226"/>
    <path d="M222 230 L290 230"/>
    <path d="M256 96 L240 118 L262 126 L244 150" stroke-width="4"/>
  </g>

  <text x="256" y="330" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" fill="#c0392b" letter-spacing="2">FRAGILE</text>
  <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#c0392b" letter-spacing="3">DO NOT STACK</text>

  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#9c7c4d" stroke-width="4"/>
</svg>
