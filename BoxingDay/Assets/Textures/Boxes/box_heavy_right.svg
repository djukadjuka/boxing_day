<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ===== Boxing Day :: Heavy box RIGHT side (cross-strap) ===== -->
  <defs>
    <pattern id="cor_hvy" width="12" height="20" patternUnits="userSpaceOnUse">
      <rect width="12" height="20" fill="#9a7644"/>
      <rect x="0" width="6" height="20" fill="#8a683a"/>
    </pattern>
    <pattern id="speck_hvy" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="7"  cy="10" r="1.4" fill="#000000" fill-opacity="0.11"/>
      <circle cx="25" cy="18" r="1.1" fill="#000000" fill-opacity="0.086"/>
      <circle cx="15" cy="32" r="1.6" fill="#000000" fill-opacity="0.071"/>
      <circle cx="34" cy="34" r="1.1" fill="#000000" fill-opacity="0.094"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#b58e57"/>
  <rect width="512" height="512" fill="url(#speck_hvy)"/>
  <rect x="0" y="0"   width="512" height="20" fill="url(#cor_hvy)"/>
  <rect x="0" y="492" width="512" height="20" fill="url(#cor_hvy)"/>

  <!-- one horizontal cross-strapping band with rivets -->
  <g>
    <rect x="0" y="239" width="512" height="34" fill="#2c2620"/>
    <rect x="0" y="239" width="512" height="3" fill="#ffffff" fill-opacity="0.078"/>
    <rect x="0" y="270" width="512" height="3" fill="#000000" fill-opacity="0.188"/>
    <g fill="#6b6b6b">
      <circle cx="60"  cy="256" r="4"/><circle cx="256" cy="256" r="4"/><circle cx="452" cy="256" r="4"/>
    </g>
  </g>

  <!-- metal corner brackets -->
  <g fill="#8d8d8d" stroke="#5f5f5f" stroke-width="2">
    <path d="M6 6 L92 6 L92 22 L22 22 L22 92 L6 92 Z"/>
    <path d="M506 6 L420 6 L420 22 L490 22 L490 92 L506 92 Z"/>
    <path d="M6 506 L92 506 L92 490 L22 490 L22 420 L6 420 Z"/>
    <path d="M506 506 L420 506 L420 490 L490 490 L490 420 L506 420 Z"/>
  </g>

  <!-- forklift / handling notice (upper) -->
  <g fill="#1d1a16" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="256" y="120" font-size="22" font-weight="900" letter-spacing="3">CAUTION</text>
    <text x="256" y="150" font-size="15" font-weight="700" letter-spacing="2">HEAVY ITEM &#8226; DO NOT THROW</text>
  </g>

  <!-- no-stack icon (lower) -->
  <g transform="translate(256 380)" stroke="#1d1a16" stroke-width="6" fill="none">
    <rect x="-46" y="-30" width="92" height="26"/>
    <rect x="-46" y="6"  width="92" height="26"/>
    <line x1="-70" y1="-54" x2="70" y2="56"/>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="monospace" font-size="13" fill="#1d1a16">CT-H-118</text>

  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#7d6038" stroke-width="4"/>
</svg>
