<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ===== Boxing Day :: Regular cardboard box face ===== -->
  <defs>
    <pattern id="cor_reg" width="12" height="20" patternUnits="userSpaceOnUse">
      <rect width="12" height="20" fill="#b8945f"/>
      <rect x="0" width="6" height="20" fill="#a9854f"/>
    </pattern>
    <pattern id="speck_reg" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6"  cy="9"  r="1.4" fill="#000000" fill-opacity="0.086"/>
      <circle cx="24" cy="16" r="1.1" fill="#000000" fill-opacity="0.071"/>
      <circle cx="14" cy="31" r="1.6" fill="#000000" fill-opacity="0.059"/>
      <circle cx="33" cy="35" r="1.1" fill="#000000" fill-opacity="0.078"/>
      <circle cx="37" cy="6"  r="1.0" fill="#000000" fill-opacity="0.063"/>
    </pattern>
  </defs>

  <!-- base cardboard -->
  <rect width="512" height="512" fill="#cda874"/>
  <rect width="512" height="512" fill="url(#speck_reg)"/>

  <!-- corrugated cut edges (top/bottom) -->
  <rect x="0" y="0"   width="512" height="20" fill="url(#cor_reg)"/>
  <rect x="0" y="492" width="512" height="20" fill="url(#cor_reg)"/>

  <!-- fold seam down the middle -->
  <rect x="254" y="20" width="4" height="472" fill="#000000" fill-opacity="0.071"/>

  <!-- packing tape across the upper third -->
  <rect x="0" y="118" width="512" height="56" fill="#e7dbb6" opacity="0.85"/>
  <rect x="0" y="118" width="512" height="4" fill="#000000" fill-opacity="0.133"/>
  <rect x="0" y="170" width="512" height="4" fill="#000000" fill-opacity="0.133"/>
  <rect x="0" y="127" width="512" height="2" fill="#ffffff" fill-opacity="0.267"/>

  <!-- THIS WAY UP -->
  <g fill="#3a5a78">
    <path d="M32 84 L44 68 L56 84 L49 84 L49 102 L39 102 L39 84 Z"/>
    <path d="M60 84 L72 68 L84 84 L77 84 L77 102 L67 102 L67 84 Z"/>
    <text x="96" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">THIS WAY UP</text>
  </g>

  <!-- shipping label -->
  <rect x="120" y="232" width="272" height="156" rx="4" fill="#f4f0e2" stroke="#2b2b2b" stroke-width="3"/>
  <text x="256" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#2b2b2b" letter-spacing="1">CARTWRIGHT</text>
  <text x="256" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2b2b2b" letter-spacing="4">TRADING CO.</text>
  <line x1="140" y1="302" x2="372" y2="302" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="140" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3a3a3a">HARBOR GLEN, BELLMONT</text>
  <text x="140" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3a3a3a">LOT 14  ·  STD FREIGHT</text>

  <!-- barcode -->
  <g fill="#1a1a1a">
    <rect x="140" y="350" width="3" height="22"/><rect x="145" y="350" width="2" height="22"/>
    <rect x="149" y="350" width="4" height="22"/><rect x="156" y="350" width="2" height="22"/>
    <rect x="160" y="350" width="2" height="22"/><rect x="165" y="350" width="5" height="22"/>
    <rect x="173" y="350" width="2" height="22"/><rect x="178" y="350" width="3" height="22"/>
    <rect x="184" y="350" width="2" height="22"/><rect x="189" y="350" width="2" height="22"/>
    <rect x="194" y="350" width="4" height="22"/><rect x="201" y="350" width="2" height="22"/>
    <rect x="206" y="350" width="3" height="22"/><rect x="212" y="350" width="2" height="22"/>
    <rect x="217" y="350" width="5" height="22"/><rect x="225" y="350" width="2" height="22"/>
    <rect x="230" y="350" width="2" height="22"/><rect x="235" y="350" width="3" height="22"/>
    <rect x="241" y="350" width="4" height="22"/><rect x="248" y="350" width="2" height="22"/>
    <rect x="253" y="350" width="2" height="22"/><rect x="258" y="350" width="3" height="22"/>
    <rect x="264" y="350" width="5" height="22"/><rect x="272" y="350" width="2" height="22"/>
    <rect x="277" y="350" width="3" height="22"/><rect x="283" y="350" width="2" height="22"/>
    <rect x="288" y="350" width="4" height="22"/><rect x="295" y="350" width="2" height="22"/>
  </g>
  <text x="372" y="368" text-anchor="end" font-family="monospace" font-size="12" fill="#2b2b2b">CT-0042</text>

  <!-- corner scuffs -->
  <path d="M0 0 L64 0 L0 64 Z" fill="#000000" fill-opacity="0.063"/>
  <path d="M512 512 L448 512 L512 448 Z" fill="#000000" fill-opacity="0.063"/>

  <!-- box edge -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#9c7c4d" stroke-width="4"/>
</svg>
