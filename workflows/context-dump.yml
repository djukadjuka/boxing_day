name: Generate Context Dump

on:
  push:
    branches:
      - master

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate context.txt
        run: |
          find BoxingDay/Assets/Scripts -name "*.cs" | sort | while read f; do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done > context.txt

      - name: Commit context.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add context.txt
          git diff --staged --quiet || git commit -m "chore: update context dump"
          git push